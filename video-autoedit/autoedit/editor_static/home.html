<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숏폼 편집기 · 홈</title>
<style>
:root{--bg:#151517;--panel:#1d1d20;--panel2:#232327;--line:#2c2c31;--line2:#38383e;--text:#e8e8ea;--muted:#8d8d95;--dim:#5f5f66;--accent:#00c4cc;--accent2:#1fd5dd;--danger:#ff5c5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#55555d}button:disabled{opacity:.45;cursor:default}
button.accent{background:var(--accent);border-color:var(--accent);color:#06292b;font-weight:700}
button.accent:hover:not(:disabled){background:var(--accent2)}
button.ghost{background:transparent;border-color:transparent}
input,select,textarea{background:#121214;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#app{display:grid;grid-template-columns:200px 1fr;height:100vh}
@media (max-width:900px){#app{grid-template-columns:64px 1fr}#side .lbl,#side .brand b{display:none}}
#side{background:#18181b;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:0 6px 16px}
.brand b{background:linear-gradient(135deg,#00c4cc,#7c5cff);-webkit-background-clip:text;color:transparent}
#side button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);text-align:left}
#side button:hover{background:var(--panel2);color:var(--text)}#side button.on{background:#14393b;color:var(--accent)}
#side .sp{flex:1}
#main{overflow:auto;padding:24px 28px}
@media (max-width:900px){#main{padding:16px}}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:12px}
#drop{border:2px dashed var(--line2);border-radius:14px;padding:28px;display:flex;align-items:center;gap:20px;cursor:pointer;background:linear-gradient(135deg,#17262a,#1d1d24);transition:.15s}
#drop:hover,#drop.over{border-color:var(--accent);background:linear-gradient(135deg,#123338,#1f1f2b)}
#drop .plus{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#06292b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:300;flex:none}
#drop b{font-size:17px}
.banner{border:1px solid #6a2b2b;background:#2a1717;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.banner b{color:#ff8f8f}
.banner.upd{border-color:#1d6f73;background:#122a2c}.banner.upd b{color:var(--accent2)}
.banner ul{margin:6px 0 0;padding-left:18px}
.updbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.updbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ptools input{flex:1;min-width:180px;max-width:360px}
.ptools button.on{border-color:var(--accent);color:var(--accent)}
.filters button small{color:var(--dim);margin-left:4px}
.more{display:block;margin:14px auto 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{padding:3px 10px;border-radius:999px;font-size:12px}
#notes{width:100%;min-height:72px;resize:vertical;background:#121214;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
.filters button{padding:4px 12px;border-radius:999px}.filters button.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.pc:hover{border-color:#55555d}
.pc .cv{aspect-ratio:9/12;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:28px}
.pc .body{padding:8px 10px}
.pc .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .meta{color:var(--muted);font-size:11px;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pc .st{position:absolute;left:8px;top:8px;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700}
.pc .ver{position:absolute;right:8px;top:8px;font-size:11px;padding:1px 6px;border-radius:5px;background:#000a}
.pc .acts{position:absolute;right:8px;bottom:58px;display:flex;gap:4px;opacity:0;transition:.12s}.pc:hover .acts{opacity:1}
.pc .acts button{padding:3px 8px;font-size:11px;background:#000c}
.st-편집중{background:#3a3a42;color:#ddd}.st-컨펌요청{background:#2a6ae0;color:#fff}.st-수정요청{background:#c2410c;color:#fff}.st-승인{background:#15803d;color:#fff}.st-업로드완료{background:#555;color:#ddd}
.empty{color:var(--dim);text-align:center;padding:40px}
/* 모달 */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}
#modal.on{display:flex}
#mbox{width:min(820px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px 22px}
#mbox h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center}#mbox h3 span{flex:1}
.sec{margin-top:16px}.sec>.t{font-weight:700;margin-bottom:8px}
.files .f{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.files .f .bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}.files .f .bar i{display:block;height:100%;background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opt{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:#55555d}.opt.on{border-color:var(--accent);background:#14393b66}
.opt b{display:block}.opt small{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.refbox{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.refbox textarea{width:100%;min-height:54px;resize:vertical;background:#121214;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
.warnline{color:#f0b84a;font-size:12px}
label.ck{display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px 0}
.foot{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-20px;margin:20px -22px -20px;padding:14px 22px;background:var(--panel);border-top:1px solid var(--line)}
#prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:14px 0 8px}#prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.set{max-width:640px}.set .fld{margin-bottom:16px}.set label{display:block;color:var(--muted);margin-bottom:5px}.set input,.set select{width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.chk .m{width:20px;text-align:center;font-weight:800}.ok{color:#7ff0b8}.bad{color:#ff8f8f}.opt-miss{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2a30;border:1px solid var(--line2);padding:10px 16px;border-radius:8px;display:none;max-width:560px;white-space:pre-wrap;z-index:30}
#busy{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:25;font-size:15px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="brand"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg><b>숏폼 편집기</b></div>
    <button data-page="home" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">홈</span></button>
    <button data-page="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">설정·점검</span></button>
    <span class="sp"></span>
    <button id="openWs" title="작업 폴더 열기"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">작업 폴더</span></button>
  </nav>
  <main id="main"></main>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="busy"><div id="busyMsg"></div></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="video/*" multiple hidden>
<input type="file" id="refPick" accept="video/*" multiple hidden>

<script>
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const encUrl = s => encodeURIComponent(s).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const toast = (m, ms = 3200) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms); };
const busy = (on, m = "") => { $("#busy").style.display = on ? "flex" : "none"; $("#busyMsg").innerHTML = m; };
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
let H = null, page = "home", filter = {profile: "", status: "", q: "", sort: "updated", archived: false}, shown = 24;
const PAGE = 24;
const STYLE_OF = {explainer: "설명형", funny: "유머", demo: "시연"};
const profName = k => (H.profiles.find(p => p.key === k) || {}).name || (k ? k : "프로필 없음");

async function load() { H = await api("/app/api/home"); render(); if (H.job.state === "running") showProgress(); loadUpdate(); }

/* ---------------- 업데이트 ---------------- */
let U = null;
async function loadUpdate(force) {
  try { U = force ? await api("/app/api/update/check", {}) : await api("/app/api/update"); } catch (e) { return; }
  render();
  if (["running", "restarting"].includes(U.job.state)) watchUpdate();
}
function updBanner() {
  if (!U) return "";
  const r = U.result;
  if (r && ["rolled_back", "pip_failed"].includes(r.state)) return `<div class="banner"><b>업데이트 알림</b> — ${esc(r.message)}
    <div style="margin-top:8px"><button id="updDismiss">확인</button></div></div>`;
  if (!U.check.available || U.dev) return "";
  return `<div class="banner upd"><b>새 버전 ${esc(U.check.latest)}</b>이 있습니다 <span class="muted small">(지금 ${esc(U.version)}${U.check.date ? " · " + esc(U.check.date) : ""})</span>
    ${U.check.notes.length ? `<ul class="small">${U.check.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    <div class="row" style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="accent" id="updGo">지금 업데이트</button>
    <span class="muted small">편집 중인 내용은 자동 저장되어 있습니다. 끝나면 프로그램이 다시 열립니다.</span></div></div>`;
}
function updSection() {
  if (!U) return `<div class="updbox muted small">업데이트 정보를 불러오는 중…</div>`;
  const c = U.check, b = U.backup;
  const status = U.dev ? "개발용 폴더(git)라서 앱 업데이트를 쓰지 않습니다. git pull로 받으세요."
    : c.error ? "확인 실패: " + c.error : c.available ? `새 버전 ${c.latest}이 있습니다` : `최신 버전입니다${c.latest ? "" : ""}`;
  return `<div class="updbox" id="updBox">
    <div><b>지금 버전 ${esc(U.version)}</b> <span class="muted small">· ${esc(status)}</span></div>
    ${U.dev ? "" : `<div class="row">
      <button id="updCheck">새 버전 확인</button>
      ${c.available ? `<button class="accent" id="updGo">${esc(c.latest)}(으)로 업데이트</button>` : ""}
      <button id="updFileBtn" title="담당자에게 받은 shortform-editor.zip으로 업데이트">파일로 업데이트</button>
      ${b ? `<button id="updBack">이전 버전(${esc(b.from)})으로 되돌리기</button>` : ""}
      <input type="file" id="updFile" accept=".zip" hidden></div>`}
    <div class="muted small">업데이트는 프로그램 파일만 바꿉니다. 작업 폴더·프로젝트·설정·내 목소리는 그대로 남습니다.
      ${U.supervised ? "" : "<br>지금은 자동 다시 시작이 안 되는 방식으로 실행 중입니다. 업데이트 뒤 검은 창을 닫고 바로가기로 다시 실행하세요."}</div>
  </div>`;
}
let updWatching = false;
async function watchUpdate() {
  if (updWatching) return; updWatching = true;
  const t0 = Date.now(); let target = null;
  try {
    while (Date.now() - t0 < 15 * 60 * 1000) {
      let s = null; try { s = await api("/app/api/update"); } catch (e) { /* 다시 시작하는 동안은 응답이 없다 */ }
      if (s) {
        const j = s.job;
        if (j.state === "running") busy(true, `업데이트 중 · ${esc(j.step || "")} ${Math.round((j.progress || 0) * 100)}%`);
        else if (j.state === "error") { busy(false); U = s; render(); toast(j.error, 12000); return; }
        else if (j.state === "restarting") {
          target = j.to;
          if (!j.supervised) { busy(true, `업데이트를 적용했습니다(${esc(j.from || "")} → ${esc(j.to)}).<br><b>검은 창을 닫고 바탕화면 바로가기로 다시 실행하세요.</b>`); return; }
          busy(true, `${j.rollback ? "되돌리기" : "업데이트"} 완료 · ${esc(j.to)} 버전으로 다시 시작하는 중…<br><span class="small">구성요소를 새로 설치하면 몇 분 걸릴 수 있습니다(검은 창에서 진행 상황 확인).</span>`);
        }
        else if (target) { location.reload(); return; }  // 새 프로세스가 떴다(실패해 되돌렸으면 알림 띠가 뜬다)
        else if (j.state === "idle" && !target) { busy(false); return; }
      }
      await new Promise(r => setTimeout(r, 900));
    }
    busy(false); toast("다시 시작이 너무 오래 걸립니다. 검은 창의 내용을 확인하세요.", 12000);
  } finally { updWatching = false; }
}
async function updAction(fn) { try { U = await fn(); render(); watchUpdate(); } catch (e) { busy(false); toast(e.message, 9000); } }
function render() { $$("#side [data-page]").forEach(b => b.classList.toggle("on", b.dataset.page === page)); page === "home" ? renderHome() : renderSettings(); }

/* ---------------- 홈 ---------------- */
function renderHome() {
  const bad = H.checks.filter(c => c.required && !c.ok);
  $("#main").innerHTML = `
    <h1>${H.settings.user_name ? esc(H.settings.user_name) + "님, " : ""}오늘은 어떤 영상을 만들까요?</h1>
    <div class="muted small" style="margin-bottom:16px">작업 폴더: ${esc(H.workspace)}</div>
    ${bad.length ? `<div class="banner"><b>먼저 해결해야 할 설치 문제 ${bad.length}개</b> — ${bad.map(c => esc(c.name)).join(", ")}
      <div class="small" style="margin-top:4px">${bad.map(c => "→ " + esc(c.fix)).join("<br>")}</div>
      <button style="margin-top:8px" data-page="settings">설정·점검 열기</button></div>` : ""}
    ${updBanner()}
    <div id="drop"><div class="plus">+</div><div><b>새 프로젝트</b><div class="muted">촬영한 영상을 여기에 끌어다 놓거나 눌러서 고르세요. 여러 개도 됩니다.</div>
      <div class="muted small">AI가 컷·후킹·자막·효과음을 먼저 편집해 두고, 편집기에서 다듬습니다.</div></div></div>
    <h2>프로젝트 <span class="muted small" id="pcount"></span></h2>
    <div class="ptools"><input id="pq" type="search" placeholder="이름·주제·편집 요청으로 찾기" value="${esc(filter.q)}">
      <select id="psort"><option value="updated" ${filter.sort === "updated" ? "selected" : ""}>최근 수정순</option><option value="old" ${filter.sort === "old" ? "selected" : ""}>오래된순</option><option value="name" ${filter.sort === "name" ? "selected" : ""}>이름순</option></select>
      <button id="parch" class="${filter.archived ? "on" : ""}">${filter.archived ? "보관함 닫기" : "보관함"} <span class="muted small">${H.projects.filter(p => p.archived).length}</span></button></div>
    <div class="filters" id="pfilters"></div>
    <div id="plist"></div>`;
  renderList();
}
function projectMatches(p) {
  if (!!p.archived !== filter.archived) return false;
  if (filter.profile && p.profile !== filter.profile) return false;
  if (filter.status && p.status !== filter.status) return false;
  const q = filter.q.trim().toLowerCase();
  return !q || [p.name, p.topic, p.notes, p.reference, p.platform_label, profName(p.profile)].join(" ").toLowerCase().includes(q);
}
function renderList() {
  const base = H.projects.filter(p => !!p.archived === filter.archived);
  const list = H.projects.filter(projectMatches);
  if (filter.sort === "old") list.reverse();
  if (filter.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const cnt = (f) => base.filter(f).length;
  $("#pcount").textContent = `${list.length}개${filter.archived ? " · 보관함" : ""}`;
  $("#pfilters").innerHTML = `
      <button data-fp="" class="${!filter.profile ? "on" : ""}">전체 채널<small>${base.length}</small></button>
      ${H.profiles.map(p => `<button data-fp="${esc(p.key)}" class="${filter.profile === p.key ? "on" : ""}">${esc(p.name)}<small>${cnt(x => x.profile === p.key)}</small></button>`).join("")}
      <span style="width:12px"></span>
      <button data-fs="" class="${!filter.status ? "on" : ""}">모든 상태</button>
      ${H.review_states.map(s => `<button data-fs="${s}" class="${filter.status === s ? "on" : ""}">${s}<small>${cnt(x => x.status === s)}</small></button>`).join("")}`;
  const page_ = list.slice(0, shown);

});
const drop = () => $("#drop");
document.addEventListener("dragover", e => { e.preventDefault(); drop()?.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) drop()?.classList.remove("over"); });
document.addEventListener("drop", e => { e.preventDefault(); drop()?.classList.remove("over"); if (e.dataTransfer.files.length) { if (page !== "home") { page = "home"; render(); } startNew([...e.dataTransfer.files]); } });

/* ---------------- 설정·점검 ---------------- */
function renderSettings() {
  const s = H.settings;
  $("#main").innerHTML = `<h1>설정·점검</h1><div class="muted" style="margin-bottom:12px">이 PC에만 저장됩니다(사용자 폴더의 .autoedit).</div>
    <div class="set">
      <div class="fld"><label>작업자 이름 (검수표에 '제작'으로 표시)</label><input id="sName" value="${esc(s.user_name)}" placeholder="예) 김대리"></div>
      <div class="fld"><label>작업 폴더 (프로젝트·완성본이 쌓이는 곳)</label><input id="sWs" value="${esc(H.workspace)}"></div>
      <div class="fld"><label>자동 캡션 정확도</label><select id="sWh" ${s.whisper_installed ? "" : "disabled"}>
        ${[["tiny", "가장 빠름(정확도 낮음)"], ["base", "빠름"], ["small", "권장(균형)"], ["medium", "정확(느림·고사양)"], ["none", "사용 안 함"]].map(([k, n]) => `<option value="${k}" ${s.whisper_model === k ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="fld"><label>AI 음성 엔진 (VoiceStudio · 이 PC에서 무료로 동작)</label><select id="sVm">
        ${s.voice_models.map(m => `<option value="${m.id}" ${m.id === s.voicestudio_model ? "selected" : ""}>${esc(m.label)} — ${esc(m.license)}${m.commercial ? "" : " · 비상업용(회사·광고 영상 금지)"}</option>`).join("")}</select></div>
      <div class="fld"><label>VoiceStudio 주소 <span class="muted small">(보통 그대로 두세요)</span></label><input id="sVu" value="${esc(s.voicestudio_url)}"></div>
      <div class="fld"><label>AI 편집 기획 키 (Claude) ${s.anthropic ? `<span class="ok">· 설정됨</span>` : `<span class="muted">· 없으면 규칙 기반 편집</span>`}</label><input id="sAn" type="password" placeholder="${s.anthropic ? "바꿀 때만 입력" : "console.anthropic.com → API Keys"}"></div>
      <div class="fld"><label>GitHub 키 <span class="muted small">(선택 · 프로그램 저장소가 비공개일 때 업데이트용) ${U?.token ? "· 설정됨" : ""}</span></label>
        <input id="sGh" type="password" placeholder="${U?.token ? "바꿀 때만 입력" : "보통 비워 둡니다"}"></div>
      <button class="accent" id="sSave">저장</button>
      <h2>업데이트</h2>
      ${updSection()}
      <h2>설치 점검 <button id="sCheck">다시 점검</button></h2>
      ${H.checks.map(c => `<div class="chk"><span class="m ${c.ok ? "ok" : c.required ? "bad" : "opt-miss"}">${c.ok ? "✓" : c.required ? "✕" : "–"}</span>
        <div><b>${esc(c.name)}</b> ${c.required ? "" : `<span class="muted small">(선택)</span>`}<div class="muted small">${esc(c.detail)}</div>${c.ok ? "" : `<div class="small">→ ${esc(c.fix)}</div>`}</div></div>`).join("")}
    </div>`;
}
$("#main").addEventListener("click", async e => {
  if (e.target.id === "sSave") {
    busy(true, "저장 중…");
    try { H = await api("/app/api/settings", {user_name: $("#sName").value.trim(), workspace: $("#sWs").value.trim(), whisper_model: $("#sWh").value, voicestudio_model: $("#sVm").value, voicestudio_url: $("#sVu").value.trim(), anthropic_key: $("#sAn").value.trim(), github_key: $("#sGh")?.value.trim() || ""}); if ($("#sGh")?.value) loadUpdate(true); renderSettings(); toast("저장했습니다"); }
    catch (err) { toast(err.message, 6000); } finally { busy(false); }
  }
  const id = e.target.id;
  if (id === "updCheck") { busy(true, "새 버전 확인 중…"); try { U = await api("/app/api/update/check", {}); render(); toast(U.check.error || (U.check.available ? `새 버전 ${U.check.latest}이 있습니다` : "최신 버전입니다")); } finally { busy(false); } }
  if (id === "updGo") { busy(true, "업데이트 준비 중…"); updAction(() => api("/app/api/update/start", {})); }
  if (id === "updFileBtn") $("#updFile").click();
  if (id === "updBack" && confirm(`이전 버전(${U.backup.from})으로 되돌릴까요? 프로그램이 다시 시작됩니다.`)) { busy(true, "되돌리는 중…"); updAction(() => api("/app/api/update/rollback", {})); }
  if (id === "updDismiss") { U = await api("/app/api/update/dismiss", {}); render(); }
  if (e.target.id === "sCheck") { busy(true, "점검 중…"); try { H = await api("/app/api/checks", {}); renderSettings(); } finally { busy(false); } }
});
$("#main").addEventListener("change", async e => {
  if (e.target.id !== "updFile" || !e.target.files[0]) return;
  const f = e.target.files[0]; busy(true, `업데이트 파일 올리는 중… ${esc(f.name)}`);
  updAction(async () => { const r = await fetch("/app/api/update/file", {method: "POST", body: f}); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
});
$("#side").addEventListener("click", async e => {
  const pg = e.target.closest("[data-page]"); if (pg) { page = pg.dataset.page; return render(); }
  if (e.target.closest("#openWs")) { const j = await api("/app/api/reveal", {}); if (!j.ok) toast("작업 폴더: " + j.path, 6000); }
});
load().catch(e => toast("불러오기 실패: " + e.message, 9000));
</script>
</body>
</html>
