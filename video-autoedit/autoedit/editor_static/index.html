<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숏폼 편집기</title>
<style>
:root{
  --bg:#151517;--panel:#1d1d20;--panel2:#232327;--line:#2c2c31;--line2:#38383e;
  --text:#e8e8ea;--muted:#8d8d95;--dim:#5f5f66;--accent:#00c4cc;--accent2:#1fd5dd;
  --sel:#ffffff;--danger:#ff5c5c;
  --t-fx:#6e55d9;--t-text:#c7783c;--t-cap:#b5683a;--t-stk:#b8962a;--t-main:#2a3442;--t-aud:#1f8a74;
  --hook:#ff5d73;--cta:#3ecf8e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.45 -apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;user-select:none}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;flex:none}
button:hover{border-color:#55555d}button:disabled{opacity:.4;cursor:default}
button.accent{background:var(--accent);border-color:var(--accent);color:#06292b;font-weight:700}
button.accent:hover{background:var(--accent2)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--panel2)}
input,select,textarea{background:#121214;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;user-select:text}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:70px;resize:vertical}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

#app{display:grid;grid-template-rows:46px minmax(300px,1fr) 6px minmax(220px,38vh);height:100vh}
/* 상단 바 */
#top{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:#18181b}
#logo{display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:-.2px}
#logo b{background:linear-gradient(135deg,#00c4cc,#7c5cff);-webkit-background-clip:text;color:transparent}
#pname{flex:1;text-align:center;color:var(--muted)}#pname b{color:var(--text)}
.chip{padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
#score.good{color:#7ff0b8;border-color:#2b5f46}#score.mid{color:#ffd27a;border-color:#6a5626}#score.bad{color:#ff8f8f;border-color:#6a2b2b}

/* 작업 영역 */
#work{display:grid;grid-template-columns:330px 1fr 300px;min-height:0}
@media (max-width:1150px){#work{grid-template-columns:270px 1fr 250px}}
aside,#player{min-height:0;border-right:1px solid var(--line);background:var(--panel)}
#right{border-right:0;border-left:1px solid var(--line)}
#left{display:grid;grid-template-columns:62px 1fr}
#lnav{border-right:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#lnav button{background:none;border:0;border-radius:8px;margin:0 5px;padding:5px 0 4px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;flex:none}
@media (max-height:820px){#lnav button svg.i{width:16px;height:16px}#lnav button{padding:4px 0 3px;font-size:10.5px}}
#lnav button:hover{color:var(--text);background:var(--panel2)}
#lnav button.on{color:var(--accent);background:#14393b}
#lpanel{overflow:auto;padding:12px}
.ph{font-weight:700;margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.ph .sp{flex:1}
.sub{color:var(--muted);margin:12px 0 6px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.card:hover{border-color:#55555d}
.card .th{height:70px;background:#000 no-repeat;background-size:cover;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card .nm{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .du{position:absolute;right:4px;top:52px;background:#000a;border-radius:4px;padding:0 4px;font-size:10px}
.card .add{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#06292b;border:0;padding:0;font-weight:900;line-height:22px;opacity:.55}
.card:hover .add{opacity:1}
.tile{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.tile .tt{flex:1}.tile .tt small{display:block;color:var(--muted)}
.tile button{padding:3px 8px}
.big{width:100%;padding:9px;margin-bottom:8px}
.note{color:var(--muted);font-size:11px;margin:6px 0}
.note a{color:var(--accent2);text-decoration:underline}
.textcard{height:70px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}

/* 플레이어 */
#player{display:grid;grid-template-rows:32px 1fr 44px}
#ptitle{display:flex;align-items:center;padding:0 12px;color:var(--muted);border-bottom:1px solid var(--line)}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;background:#101012}
#frame{position:relative;background:#000;overflow:hidden;box-shadow:0 0 0 1px #000,0 8px 30px #0008;--u:1px}
#frame video{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#ov{position:absolute;inset:0;pointer-events:none;font-weight:800;text-align:center}
#ov .o{position:absolute;left:7%;right:7%;display:flex;justify-content:center}
#ov span{display:inline-block;line-height:1.25;padding:.15em .4em;border-radius:.25em;white-space:pre-wrap}
.note.warn{color:#f0b84a}
.sc-r{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:12px;color:var(--muted)}
.sc-r b{color:var(--text);font-variant-numeric:tabular-nums}
.sc-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sc-row>*{flex:1;min-width:0}
.sc-row select,.sc-row input:not([type=color]):not([type=number]){width:100%;min-width:0;box-sizing:border-box}
.sc-row label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sc-row input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none;flex:none}
.sc-act{position:sticky;top:-1px;z-index:2;background:var(--panel);padding:6px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.sc-act button{white-space:nowrap}
.ov-cap.box span{background:rgba(0,0,0,.72);-webkit-text-stroke:0;text-shadow:none;padding:.1em .35em;border-radius:.2em}
.ov-cap.none span{-webkit-text-stroke:0}
.ov-cap span{color:#fff;-webkit-text-stroke:calc(var(--u)*0.35) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.3) calc(var(--u)*.6) #000a}
.ov-hook span{background:#111;color:#fff}
.ov-card span{color:#111}
.ov-band{position:absolute;left:0;right:0;top:30%;height:16%;background:#00000073}
.ov-cta span{background:#2a6ae0;color:#fff}
.ov-badge{position:absolute;padding:.1em .35em;background:#00000080;color:#fff;font-weight:700;border-radius:.2em}
.ov-handle{position:absolute;color:#ffffffa0;font-weight:700}
.ov-asset{position:absolute;left:7%;right:7%;display:flex;justify-content:center}
.ov-asset img,.ov-asset video{max-width:100%;max-height:100%;border:calc(var(--u)*.6) solid #fff;position:static!important;width:auto!important;height:auto!important}
.safe{position:absolute;left:0;right:0;border-top:1px dashed #ffffff30;pointer-events:none;display:none}
#frame.showsafe .safe{display:block}
#pctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;border-top:1px solid var(--line)}
#tc{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
#tc b{color:var(--accent)}
#playBtn{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
#pright{display:flex;gap:6px;justify-content:flex-end}

/* 속성 패널 */
#right{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
#rtabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);min-height:36px}
#rtabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:6px 7px;white-space:nowrap;flex:none}
#rtabs{overflow-x:auto;scrollbar-width:none}
#rtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#rbody{overflow:auto;padding:12px;min-width:0}
#right>*{min-width:0}  /* 그리드 칸이 내용 폭만큼 늘어나 패널 밖으로 넘치지 않게 */
.fld{margin-bottom:12px}.fld>label{display:block;color:var(--muted);margin-bottom:5px}
.fld input:not([type=checkbox]):not([type=range]),.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.speedrow{display:flex;align-items:center;gap:8px}.speedrow input[type=range]{flex:1;accent-color:var(--accent)}
.presets{display:flex;gap:4px;flex-wrap:wrap}.presets button{padding:3px 8px}
.presets button.on{border-color:var(--accent);color:var(--accent)}
.issue{padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.issue b{font-size:11px}.sev-상{color:#ff8f8f}.sev-중{color:#ffd27a}.sev-하{color:var(--muted)}
.empty{color:var(--dim);text-align:center;padding:30px 10px}

/* 분할선 */
#split{background:var(--bg);cursor:row-resize;border-top:1px solid var(--line)}

/* 타임라인 */
#tl{display:grid;grid-template-rows:38px 1fr;min-height:0;background:var(--panel)}
#ttools{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
#ttools .sep{width:1px;height:18px;background:var(--line2);margin:0 6px}
#ttools button{background:none;border:0;padding:5px 7px;color:#c9c9ce}
#ttools button:hover:not(:disabled){background:var(--panel2);color:#fff}
#ttools button.on{color:var(--accent)}
#ttools .sp{flex:1}
#zoom{width:110px;accent-color:var(--accent)}
#tbody{display:grid;grid-template-columns:86px 1fr;min-height:0}
#theads{border-right:1px solid var(--line);padding-top:27px;overflow:hidden}
.th-row{display:flex;align-items:center;gap:5px;padding:0 8px;color:var(--muted);font-size:11px;border-bottom:1px solid #00000000}
#tscroll{overflow:auto;position:relative}
#tcontent{position:relative;min-height:100%}
#ruler{position:sticky;top:0;height:26px;background:var(--panel);border-bottom:1px solid var(--line);z-index:4;cursor:pointer}
#ruler .tk{position:absolute;bottom:0;width:1px;background:#4a4a52}
#ruler .lb{position:absolute;top:3px;font-size:10px;color:var(--muted);transform:translateX(3px)}
.track{position:relative;border-bottom:1px solid #26262b}
.blk{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;cursor:grab;color:#fff;font-size:11px;white-space:nowrap;border:1px solid #0006}
.blk .lbl{position:absolute;left:6px;top:3px;right:6px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000c;pointer-events:none}
.blk.sel{outline:2px solid var(--sel);outline-offset:-1px;z-index:3}
.blk .hd{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.blk .hd.l{left:0}.blk .hd.r{right:0}
.blk.sel .hd{background:#ffffffd0}
.blk.sel .hd.l{border-radius:4px 0 0 4px}.blk.sel .hd.r{border-radius:0 4px 4px 0}
.b-nar{background:#4d63d8}.b-nar .lbl{top:2px}
.rec{background:#e5484d;border-color:#e5484d;color:#fff}.rec.on{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.vsel{width:100%}
.b-fx{background:var(--t-fx)}.b-text{background:var(--t-text)}.b-cap{background:var(--t-cap);opacity:.9}.b-stk{background:var(--t-stk)}.b-aud{background:var(--t-aud)}
.b-lock{cursor:pointer}
.b-main{background:var(--t-main);top:2px;bottom:2px}
.b-main .strip{position:absolute;left:0;right:0;top:0;bottom:16px;display:flex;overflow:hidden;pointer-events:none}
.b-main .strip i{flex:none;height:100%;background-repeat:no-repeat;opacity:.95}
.b-main canvas{position:absolute;left:0;right:0;bottom:0;height:16px;width:100%;pointer-events:none;background:#14281f}
.b-main .role{position:absolute;left:5px;top:4px;font-size:10px;font-weight:800;padding:0 5px;border-radius:3px;pointer-events:none}
.b-main .spd{position:absolute;right:6px;top:4px;font-size:10px;font-weight:800;background:#000a;padding:0 4px;border-radius:3px;pointer-events:none}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:6;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-6px;border:6px solid transparent;border-top:9px solid #fff}
#dropline{position:absolute;top:26px;bottom:0;width:2px;background:var(--accent);z-index:7;display:none;pointer-events:none}

/* 내보내기 창 */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
#modal.on{display:flex}
#mbox{width:min(760px,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}
#mbox h2{grid-column:1/-1;margin:0;font-size:16px;display:flex;align-items:center}
#mbox h2 span{flex:1}
#mvid{width:100%;aspect-ratio:9/16;background:#000;border-radius:8px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--accent);background:#14393b55}
.opt small{display:block;color:var(--muted)}
#prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:10px 0}
#prog i{display:block;height:100%;width:30%;background:var(--accent);animation:ld 1.2s infinite ease-in-out}
#prog.det i{animation:none;transition:width .5s}
.rq{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2)}
.rq.done{opacity:.5;text-decoration:line-through}.rq a{color:var(--accent);cursor:pointer;font-family:monospace;white-space:nowrap}
.vrow{display:flex;gap:6px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2);flex-wrap:wrap}
.vrow b{min-width:28px}.vrow a{color:var(--accent);text-decoration:none}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2a30;border:1px solid var(--line2);padding:9px 14px;border-radius:8px;display:none;max-width:560px;white-space:pre-wrap;z-index:30}
#busy{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:25;font-size:14px}
kbd{background:#2a2a30;border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:10px;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ghost" id="homeBtn" title="시작 화면으로" style="display:none">← 홈</button>
    <div id="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg><b>숏폼 편집기</b></div>
    <span class="chip" id="ratioChip">9:16</span>
    <div id="pname"></div>
    <span class="chip" id="statusChip" title="컨펌 상태(오른쪽 '수정 요청' 탭에서 변경)" style="cursor:pointer"></span>
    <span class="chip" id="saveState">저장됨</span>
    <span class="chip" id="score" title="AI 진단 점수(구조 결함 진단, 조회수 예측 아님)">진단 -</span>
    <button class="accent" id="exportBtn" title="Ctrl+E">내보내기</button>
  </header>

  <div id="work">
    <aside id="left">
      <nav id="lnav"></nav>
      <div id="lpanel"></div>
    </aside>

    <section id="player">
      <div id="ptitle">플레이어 <span style="flex:1"></span><span class="muted" id="ptip" style="color:var(--dim)">미리보기는 근사치 · 정확한 결과는 내보내기</span></div>
      <div id="stage">
        <div id="frame">
          <video id="vid" playsinline preload="auto"></video>
          <div id="flash"></div>
          <div id="ov"></div>
          <div class="safe" id="safeT"></div><div class="safe" id="safeB"></div>
        </div>
      </div>
      <div id="pctrl">
        <div id="tc"><b>00:00:00:00</b> / 00:00:00:00</div>
        <button id="playBtn" title="재생/정지 (Space)"></button>
        <div id="pright">
          <button class="ghost" id="safeBtn" title="플랫폼 UI에 가려지는 영역 표시">안전영역</button>
          <button class="ghost" id="fsBtn" title="전체 화면"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </section>

    <aside id="right">
      <div id="rtabs"></div>
      <div id="rbody"></div>
    </aside>
  </div>

  <div id="split" title="드래그해서 타임라인 높이 조절"></div>

  <section id="tl">
    <div id="ttools">
      <button id="bUndo" title="실행 취소 (Ctrl+Z)"></button>
      <button id="bRedo" title="다시 실행 (Ctrl+Shift+Z)"></button>
      <span class="sep"></span>
      <button id="bSplit" title="분할 (Ctrl+B)"></button>
      <button id="bDelL" title="왼쪽 삭제 (Q)"></button>
      <button id="bDelR" title="오른쪽 삭제 (W)"></button>
      <button id="bDel" title="삭제 (Delete)"></button>
      <span class="sep"></span>
      <button id="bDup" title="복제 (Ctrl+D)"></button>
      <span class="sp"></span>
      <button id="bMagnet" class="on" title="메인 트랙 자석: 클립 사이 빈틈 없이 붙음(항상 켜짐)"></button>
      <span class="sep"></span>
      <button id="bZoomOut" title="축소 (Ctrl+-)"></button>
      <input type="range" id="zoom" min="0" max="100" value="40">
      <button id="bZoomIn" title="확대 (Ctrl+=)"></button>
      <button id="bFit" title="타임라인 맞춤 (Shift+Z)">맞춤</button>
    </div>
    <div id="tbody">
      <div id="theads"></div>
      <div id="tscroll"><div id="tcontent"><div id="ruler"></div><div id="tracks"></div><div id="playhead"></div><div id="dropline"></div></div></div>
    </div>
  </section>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="busy"><div id="busyMsg">처리 중…</div></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= 기본 도구 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const encUrl = s => encodeURIComponent(s).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r3 = v => Math.round(v * 1000) / 1000;
const ICON = {
  media: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l4.5 2.5L10 14.5z"/>',
  audio: '<path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  sticker: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  effect: '<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  trans: '<rect x="2.5" y="6" width="9" height="12" rx="1.5"/><rect x="12.5" y="6" width="9" height="12" rx="1.5"/><path d="M9 12h6M13 10l2 2-2 2"/>',

async function api(path, body, raw) {

const tc = t => { t = Math.max(0, t || 0); const f = Math.floor((t % 1) * FPS), s = Math.floor(t) % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
  return [h, m, s, f].map(v => String(v).padStart(2, "0")).join(":"); };
const sec = t => (t ?? 0).toFixed(1) + "s";

/* ---------- 출력 배치 계산(클립 → 출력 시각) ---------- */
function relayout() {
  let cur = 0;
  L.clips = plan.clips.map((c, i) => { const d = (c.end - c.start) / (c.speed || 1); const o = {i, c, out: cur, dur: d}; cur += d; return o; });
  L.total = cur;
}
function mapTime(source, t) {      // 원본 시각 → 출력 시각(후킹 미리보기와 겹치면 본문 우선)
  let hit = null;
  for (const o of L.clips) {
    if (o.c.source === source && t >= o.c.start && t <= o.c.end) {
      if (!hit || (hit.c.role === "hook" && o.c.role !== "hook")) hit = o;
    }
  }
  return hit ? hit.out + (t - hit.c.start) / (hit.c.speed || 1) : null;
}
function locate(T) {               // 출력 시각 → 클립·원본 시각
  if (!L.clips.length) return null;
  T = clamp(T, 0, Math.max(0, L.total - 1e-3));
  const o = L.clips.find(o => T >= o.out && T < o.out + o.dur) || L.clips[L.clips.length - 1];
  return {o, srcT: clamp(o.c.start + (T - o.out) * (o.c.speed || 1), o.c.start, o.c.end)};
}
const hookEnd = () => Math.min(Math.max(L.clips.filter(o => o.c.role === "hook").reduce((a, o) => a + o.dur, 0) || 3, 2), 3.5, L.total);
const SFX_SHIFT = {whoosh: -0.2, riser: -1.0};
const listOf = type => ({fx: plan.emphases, sfx: plan.sfx, ins: plan.inserts, nar: plan.narrations}[type]);
const narSpans = () => plan.narrations.map((n, i) => { if (!n.audio) return null; const a = mapTime(n.source, n.t); return a == null ? null : {a, b: Math.min(a + n.duration, L.total), n, i}; }).filter(Boolean);

/* ---------- 편집 기록(되돌리기)·자동 저장·진단 ---------- */
function snapshot() { return JSON.stringify(plan); }
function commit(before) {   // before: 변경 전 스냅샷
  undo.push(before); if (undo.length > 200) undo.shift(); redo = [];
  changed();
}
function mutate(fn) { const b = snapshot(); fn(); commit(b); }
function changed() {
  relayout(); renderTimeline(); renderProps(); renderOverlay(true); updateTools();
  setDirty(true);
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
  clearTimeout(diagTimer); diagTimer = setTimeout(runDiag, 450);
}
function setDirty(v) { dirty = v; $("#saveState").textContent = v ? "편집 중…" : "자동 저장됨"; }
async function save() {
  try { const j = await api("/api/save", {plan}); diag = j.diagnosis; setDirty(false); renderScore(); renderOverlay(true); }
  catch (e) { $("#saveState").textContent = "저장 실패"; toast("저장 실패: " + e.message, 6000); }
}
async function runDiag() { try { diag = await api("/api/diagnose", {plan}); renderScore(); renderOverlay(true); if (!sel && rightTab === "ai") renderProps(); if (leftTab === "ai") renderLeft(); renderTimeline(); } catch (e) { toast("진단 실패: " + e.message, 5000); } }
function doUndo() { if (!undo.length) return; redo.push(snapshot()); plan = JSON.parse(undo.pop()); sel = null; changed(); }
function doRedo() { if (!redo.length) return; undo.push(snapshot()); plan = JSON.parse(redo.pop()); sel = null; changed(); }

let playT = 0, playing = false, curSrc = -1, curClip = -1, pendingSeek = null, lastFireT = 0;
function layoutFrame() {
  const st = $("#stage"), pw = S.meta.platform.width, ph = S.meta.platform.height;
  const maxW = st.clientWidth - 24, maxH = st.clientHeight - 24, k = Math.min(maxW / pw, maxH / ph);
  const f = $("#frame"); f.style.width = Math.floor(pw * k) + "px"; f.style.height = Math.floor(ph * k) + "px";
  f.style.setProperty("--u", (ph * k / 100) + "px");
  $("#safeT").style.top = (S.meta.platform.safe_top * 100) + "%"; $("#safeB").style.bottom = (S.meta.platform.safe_bottom * 100) + "%";
  renderOverlay(true);
}
function fitMode(si) {
  const s = S.sources[si], pw = S.meta.platform.width, ph = S.meta.platform.height, a = s.width / s.height;
  let m = S.meta.reframe; if (m === "auto") m = (Math.abs(a - pw / ph) < 0.25 || (a < 1) === (ph > pw)) ? "crop" : "blur";
  return m === "crop" ? "cover" : "contain";
}
function loadClip(k, srcT) {
  const o = L.clips[k]; if (!o) return;
  curClip = k;
  if (curSrc !== o.c.source) { curSrc = o.c.source; vid.src = S.sources[curSrc].url; vid.style.objectFit = fitMode(curSrc); }
  vid.playbackRate = o.c.speed || 1; vid.muted = (o.c.speed || 1) !== 1;
  if (vid.readyState >= 1) vid.currentTime = srcT; else pendingSeek = srcT;
}
vid.addEventListener("loadedmetadata", () => { if (pendingSeek != null) { vid.currentTime = pendingSeek; pendingSeek = null; } if (playing) vid.play().catch(() => {}); });
vid.addEventListener("error", () => toast("이 브라우저가 영상을 재생하지 못합니다. Chrome/Edge 최신 버전을 사용하세요.", 8000));
function seek(T) {
  relayout(); playT = clamp(T, 0, L.total); lastFireT = playT;
  const at = locate(playT); if (at) loadClip(at.o.i, at.srcT);
  renderOverlay(true); drawPlayhead(); updateTC(); syncNar(playT);
}
function play() {
  if (!L.clips.length) return;
  if (playT >= L.total - 0.05) seek(0);
  playing = true; lastFireT = playT; audioCtx?.resume?.(); vid.play().catch(() => {}); $("#playBtn").innerHTML = ic("pause");
}
function pause() { playing = false; vid.pause(); stopNar(); $("#playBtn").innerHTML = ic("play"); }
const narAudio = {};
function stopNar() { Object.values(narAudio).forEach(a => a.pause()); }
function syncNar(T) {   // 나레이션 오디오를 재생 위치에 맞추고, 원본 소리를 줄인다
  let f = 1; const live = new Set();
  for (const s of narSpans()) {
    if (T < s.a || T >= s.b) continue;
    if (s.n.original !== "keep") f *= s.n.original === "duck" ? 0.2 : 0;
    if (!playing) continue;
    const a = narAudio[s.n.audio] ||= new Audio("/media/" + s.n.audio); live.add(a);
    a.volume = Math.min(1, Math.pow(10, (s.n.volume_db || 0) / 20));
    if (a.paused || Math.abs(a.currentTime - (T - s.a)) > 0.25) { a.currentTime = T - s.a; a.play().catch(() => {}); }
  }
  Object.values(narAudio).forEach(a => { if (!live.has(a) && !a.paused) a.pause(); });
  vid.volume = f;
}
function tick() {
  if (playing && curClip >= 0 && !vid.seeking && pendingSeek == null) {
    const o = L.clips[curClip];
    if (!o) pause();
    else {
      const T = o.out + (vid.currentTime - o.c.start) / (o.c.speed || 1);
      if (vid.currentTime >= o.c.end - 0.02 || vid.ended) {
        if (curClip + 1 < L.clips.length) { const n = L.clips[curClip + 1]; playT = n.out; loadClip(curClip + 1, n.c.start); if (vid.paused) vid.play().catch(() => {}); }
        else { playT = L.total; pause(); }
      } else playT = clamp(T, o.out, o.out + o.dur);
      fireSfx(lastFireT, playT); lastFireT = playT; syncNar(playT);
      renderOverlay(); drawPlayhead(true); updateTC();
    }
  }
  requestAnimationFrame(tick);
}
function updateTC() { $("#tc").innerHTML = `<b>${tc(playT)}</b> / ${tc(L.total)}`; }

/* 효과음 재생(Web Audio) */
let audioCtx = null; const sfxBuf = {};
async function loadSfx() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  for (const x of S.sfx) { try { const ab = await (await fetch(x.url)).arrayBuffer(); sfxBuf[x.kind] = await audioCtx.decodeAudioData(ab); } catch {} }
}
function playSfx(kind) { if (!audioCtx || !sfxBuf[kind]) return; audioCtx.resume(); const s = audioCtx.createBufferSource(); s.buffer = sfxBuf[kind]; s.connect(audioCtx.destination); s.start(); }
function fireSfx(a, b) {
  if (b <= a || b - a > 0.5) return;
  for (const s of plan.sfx) { const T = mapTime(s.source, s.t); if (T == null) continue; const f = T + (SFX_SHIFT[s.kind] || 0); if (f > a && f <= b) playSfx(s.kind); }
}

/* 오버레이(자막·텍스트·자료·줌·플래시) */
let ovKey = "";
function activeAt(T) {
  const items = [], m = S.meta, H = hookEnd();
  if (plan.hook_text && T < H) items.push({k: "hook", text: plan.hook_text});
  if (plan.cta_text && T >= L.total - 3) items.push({k: "cta", text: plan.cta_text});
  const act = {card: null, asset: null};   // 같은 종류가 겹치면 나중에 시작한 것만(내보내기와 동일)
  plan.inserts.forEach((x, i) => { const t = mapTime(x.source, x.t), k = x.kind === "asset" ? "asset" : "card";
    if (t != null && T >= t && T < t + x.duration && (!act[k] || t >= act[k].t)) act[k] = {k, text: x.text, asset: x.asset, i, t}; });
  if (act.asset) items.push(act.asset); if (act.card) items.push(act.card);
  const cap = (diag?.captions || []).find(c => T >= c.start && T < c.end);
  if (cap) { const kws = plan.emphases.filter(e => e.keyword && (() => { const t = mapTime(e.source, e.t); return t != null && t >= cap.start - .3 && t <= cap.end + .3; })()).map(e => e.keyword); items.push({k: "cap", text: cap.text, kws}); }
  const labels = []; if (plan.sponsored) labels.push("유료광고"); if (plan.ai_voice_label && narSpans().length) labels.push("AI 음성");
  if (labels.length) items.push({k: "badge", text: labels.join(" · ")});
  if (m.handle) items.push({k: "handle"});
  return items;
}
function renderOverlay(force) {
  if (!S) return;
  const T = playT, m = S.meta, P = m.platform, items = activeAt(T);
  // 줌 펀치 / 플래시
  let z = 1, fl = 0;
  for (const e of plan.emphases) { const a = mapTime(e.source, e.t); if (a == null) continue;
    if (e.kind === "zoom_punch") z += m.zoom * clamp((T - a) / 0.08, 0, 1) * clamp((a + 1 - T) / 0.3, 0, 1);
    else if (T >= a && T < a + 0.1) fl = 0.35; }
  vid.style.transform = `scale(${z.toFixed(4)})`; $("#flash").style.opacity = fl;
  const key = JSON.stringify(items);
  if (!force && key === ovKey) return; ovKey = key;
  const look = m.brief.reference?.analysis?.caption || null;
  const base = "calc(var(--u)*4.2)", hl = look?.highlight_color || m.highlight;
  const capSize = {small: .85, large: 1.2}[look?.size] || 1;
  const capPos = !look || look.position === "bottom" ? `bottom:${(P.safe_bottom + .10) * 100}%`
    : look.position === "middle" ? "bottom:40%" : `top:${(P.safe_top + .04) * 100 + 9}%`;
  const hlText = (t, kws) => { let h = esc(t); [...new Set(kws)].sort((a, b) => b.length - a.length).forEach(k => { const ek = esc(k); h = h.replace(ek, `<em style="color:${hl};font-style:normal">${ek}</em>`); }); return h; };
  $("#ov").innerHTML = items.map(it => {
    if (it.k === "hook") return `<div class="o ov-hook" style="top:${(P.safe_top + .04) * 100}%;font-size:calc(${base}*1.35)"><span>${esc(it.text)}</span></div>`;
    if (it.k === "cta") return `<div class="o ov-cta" style="bottom:${(P.safe_bottom + .22) * 100}%;font-size:calc(${base}*1.1)"><span>${esc(it.text)}</span></div>`;
    if (it.k === "card") return `<div class="ov-band"></div><div class="o ov-card" style="top:38%;transform:translateY(-50%);font-size:calc(${base}*1.2)"><span style="background:${hl}">${esc(it.text)}</span></div>`;
    if (it.k === "asset") return `<div class="ov-asset" style="top:${(P.safe_top + .06) * 100}%;height:40%">${/\.(mp4|mov)$/i.test(it.asset) ? `<video src="/media/asset/${encodeURIComponent(it.asset)}" muted autoplay loop></video>` : `<img src="/media/asset/${encodeURIComponent(it.asset)}">`}</div>`;
    if (it.k === "cap") return `<div class="o ov-cap ${look ? esc(look.background) : ""}" style="${capPos};font-size:calc(${base}*${capSize})"><span${look ? ` style="color:${esc(look.text_color)}"` : ""}>${hlText(it.text, it.kws)}</span></div>`;
    if (it.k === "badge") return `<div class="ov-badge" style="left:7%;top:${P.safe_top * 100}%;font-size:calc(${base}*.55)">${esc(it.text)}</div>`;
    if (it.k === "handle") return `<div class="ov-handle" style="right:7%;top:${P.safe_top * 100}%;font-size:calc(${base}*.5)">${esc(m.handle)}</div>`;

}

/* ================= 오른쪽: 속성 패널 ================= */
function select(s) { sel = s; if (s) seekToSel(); renderTimeline(); rightTab = null; renderProps(); }
function seekToSel() {
  if (!sel) return; let T = null;
  if (sel.type === "clip") { const o = L.clips[sel.i]; if (o && (playT < o.out || playT >= o.out + o.dur)) T = o.out; }
  else if (sel.type === "fx") T = mapTime(plan.emphases[sel.i].source, plan.emphases[sel.i].t);
  else if (sel.type === "sfx") T = mapTime(plan.sfx[sel.i].source, plan.sfx[sel.i].t);
  else if (sel.type === "ins") T = mapTime(plan.inserts[sel.i].source, plan.inserts[sel.i].t);
  else if (sel.type === "hook") T = 0.5;
  else if (sel.type === "cta") T = Math.max(0, L.total - 2);
  else if (sel.type === "cap") T = diag.captions[sel.i]?.start;
  else if (sel.type === "nar") T = mapTime(plan.narrations[sel.i].source, plan.narrations[sel.i].t);

}

}
function updateTools() {

  const at = locate(playT), inClip = !!at;
  $("#bSplit").disabled = !inClip; $("#bDelL").disabled = !inClip; $("#bDelR").disabled = !inClip;

/* 타임라인 조작: 선택·이동·트리밍·재생 헤드 */
let drag = null;
const tcont = $("#tcontent");
const pointerT = e => (e.clientX - tcont.getBoundingClientRect().left) / pps;
tcont.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const blkEl = e.target.closest(".blk");
  if (!blkEl) { // 빈 곳/눈금: 재생 헤드 이동(스크럽)
    if (playing) pause();
    sel = null; renderTimeline(); renderProps(); updateTools(); seek(pointerT(e));
    drag = {kind: "scrub"}; tcont.setPointerCapture(e.pointerId); return;
  }
  const type = blkEl.dataset.type, i = blkEl.dataset.i !== undefined ? +blkEl.dataset.i : undefined, edge = e.target.dataset.edge;
  if (playing) pause();
  sel = {type, i}; renderProps(); updateTools();
  $$(".blk.sel").forEach(b => b.classList.remove("sel")); blkEl.classList.add("sel");
  drag = {kind: "blk", type, i, edge, x0: e.clientX, moved: false, before: snapshot(), orig: JSON.parse(JSON.stringify(
    type === "clip" ? plan.clips[i] : listOf(type) ? listOf(type)[i] : {})),
    T0: listOf(type) ? mapTime(listOf(type)[i].source, listOf(type)[i].t) : 0};
  tcont.setPointerCapture(e.pointerId);
});
tcont.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.kind === "scrub") { seek(pointerT(e)); return; }
  const dx = e.clientX - drag.x0; if (!drag.moved && Math.abs(dx) < 4) return; drag.moved = true;
  const dt = dx / pps, {type, i, edge, orig} = drag;
  if (type === "clip") {
    const c = plan.clips[i], s = S.sources[c.source], sp = orig.speed || 1;
    if (edge === "l") c.start = r3(clamp(orig.start + dt * sp, 0, orig.end - 0.1));
    else if (edge === "r") c.end = r3(clamp(orig.end + dt * sp, orig.start + 0.1, s.duration));
    else { // 순서 이동: 놓을 위치 표시
      const T = pointerT(e); let k = L.clips.findIndex(o => T < o.out + o.dur / 2); if (k < 0) k = L.clips.length;
      drag.to = k; const x = k < L.clips.length ? xOf(L.clips[k].out) : xOf(L.total);
      const dl = $("#dropline"); dl.style.display = "block"; dl.style.left = x + "px"; return;
    }
    renderTimeline(); seek(edge === "l" ? L.clips[i].out : L.clips[i].out + L.clips[i].dur - 0.01);
  } else if (listOf(type)) {
    const it = listOf(type)[i];
    if (edge === "r" && type === "ins") it.duration = Math.max(0.3, r3(orig.duration + dt));
    else { const at = locate(clamp(drag.T0 + dt, 0, L.total)); if (at) { it.source = at.o.c.source; it.t = r3(at.srcT); } }
    renderTimeline(); renderOverlay(true);
  }
});
tcont.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null; $("#dropline").style.display = "none";
  if (d.kind !== "blk") return;
  if (!d.moved) { seekToSel(); renderTimeline(); return; }
  if (d.type === "clip" && !d.edge && d.to !== undefined) {
    const from = d.i; let to = d.to; if (to > from) to--;
    if (to !== from) { const [c] = plan.clips.splice(from, 1); plan.clips.splice(to, 0, c); sel = {type: "clip", i: to}; }
  }
  commit(d.before);
});
$("#tscroll").addEventListener("wheel", e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(pps * (e.deltaY < 0 ? 1.15 : 1 / 1.15), pointerT(e)); }
  else if (!e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); $("#tscroll").scrollLeft += e.deltaY; }
}, {passive: false});

/* 도구 동작(CapCut 단축키와 동일) */
function clipAtPlayhead() { const at = locate(playT); if (!at) return null; if (sel?.type === "clip" && L.clips[sel.i] && playT >= L.clips[sel.i].out && playT < L.clips[sel.i].out + L.clips[sel.i].dur) return {o: L.clips[sel.i], srcT: L.clips[sel.i].c.start + (playT - L.clips[sel.i].out) * (L.clips[sel.i].c.speed || 1)}; return at; }
function doSplit() {
  const at = clipAtPlayhead(); if (!at) return; const c = at.o.c, t = r3(at.srcT);
  if (t - c.start < 0.1 || c.end - t < 0.1) return toast("클립 끝과 너무 가까워 자를 수 없습니다");
  mutate(() => { const b = {...c, start: t, role: c.role === "hook" ? "body" : c.role, reason: c.reason}; c.end = t; plan.clips.splice(at.o.i + 1, 0, b); sel = {type: "clip", i: at.o.i + 1}; });
}
function doDelLeft() { const at = clipAtPlayhead(); if (!at) return; const c = at.o.c, t = r3(at.srcT); if (t - c.start < 0.05) return;
  mutate(() => { c.start = t; }); seek(L.clips[at.o.i].out); }
function doDelRight() { const at = clipAtPlayhead(); if (!at) return; const c = at.o.c, t = r3(at.srcT); if (c.end - t < 0.05) return;
  mutate(() => { c.end = t; }); }
function doDelete() {
  if (!sel) return; const {type, i} = sel;
  if (type === "cap") return toast("캡션은 왼쪽 '캡션' 탭에서 문장을 지우거나 고치세요");
  mutate(() => {
    if (type === "clip") plan.clips.splice(i, 1);
    else if (type === "fx") plan.emphases.splice(i, 1);
    else if (type === "sfx") plan.sfx.splice(i, 1);
    else if (type === "ins") plan.inserts.splice(i, 1);
    else if (type === "nar") plan.narrations.splice(i, 1);
    else if (type === "hook") plan.hook_text = "";
    else if (type === "cta") plan.cta_text = "";
    sel = null;
  });
}
function doDup() {
  if (!sel) return; const {type, i} = sel;
  mutate(() => {
    if (type === "clip") { plan.clips.splice(i + 1, 0, {...plan.clips[i], role: "body"}); sel = {type, i: i + 1}; }
    else { const list = listOf(type), it = list[i], T = mapTime(it.source, it.t);
      const at = locate((T ?? 0) + (type === "ins" ? it.duration : type === "nar" ? it.duration : 1)); if (at) { list.push({...it, source: at.o.c.source, t: r3(at.srcT)}); sel = {type, i: list.length - 1}; } }
  });
}
const tb = [["bUndo", "undo", doUndo], ["bRedo", "redo", doRedo], ["bSplit", "split", doSplit], ["bDelL", "delL", doDelLeft], ["bDelR", "delR", doDelRight],
  ["bDel", "trash", doDelete], ["bDup", "dup", doDup], ["bMagnet", "magnet", () => toast("메인 트랙은 항상 자석 모드입니다(빈틈 없이 붙음)")],
  ["bZoomIn", "zin", () => setZoom(pps * 1.4)], ["bZoomOut", "zout", () => setZoom(pps / 1.4)]];
tb.forEach(([id, icon, fn]) => { $("#" + id).innerHTML = ic(icon); $("#" + id).onclick = fn; });
$("#bFit").onclick = () => { fitZoom(); renderTimeline(); };

/* 타임라인 높이 조절 */
$("#split").addEventListener("pointerdown", e => {
  const app = $("#app"), y0 = e.clientY, h0 = $("#tl").getBoundingClientRect().height;
  const mv = ev => { const h = clamp(h0 - (ev.clientY - y0), 180, window.innerHeight - 260); app.style.gridTemplateRows = `46px minmax(260px,1fr) 6px ${h}px`; };

/* 단축키(CapCut 기본값) */
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input,textarea,select"), mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === "s") { e.preventDefault(); return save(); }
  if (mod && k === "e") { e.preventDefault(); return openExport(); }
  if (typing) return;
  if (mod && k === "z") { e.preventDefault(); return e.shiftKey ? doRedo() : doUndo(); }
  if (mod && k === "y") { e.preventDefault(); return doRedo(); }
  if (mod && k === "b") { e.preventDefault(); return doSplit(); }
  if (mod && k === "d") { e.preventDefault(); return doDup(); }
  if (mod && (k === "=" || k === "+")) { e.preventDefault(); return setZoom(pps * 1.4); }
  if (mod && k === "-") { e.preventDefault(); return setZoom(pps / 1.4); }
  if (e.shiftKey && k === "z") return $("#bFit").click();
  if (k === " ") { e.preventDefault(); return playing ? pause() : play(); }
  if (k === "q") return doDelLeft();
  if (k === "w") return doDelRight();
  if (k === "delete" || k === "backspace") { e.preventDefault(); return doDelete(); }
  if (k === "arrowleft") { e.preventDefault(); return seek(playT - (e.shiftKey ? 1 : 1 / FPS)); }
  if (k === "arrowright") { e.preventDefault(); return seek(playT + (e.shiftKey ? 1 : 1 / FPS)); }
  if (k === "arrowup" || k === "arrowdown") { e.preventDefault(); const pts = [0, ...L.clips.map(o => o.out), L.total];
    const T = k === "arrowup" ? [...pts].reverse().find(p => p < playT - 1e-3) : pts.find(p => p > playT + 1e-3); if (T != null) seek(T); return; }
  if (k === "home") return seek(0);
  if (k === "end") return seek(L.total);
  if (k === "escape") { sel = null; renderTimeline(); renderProps(); updateTools(); }
});
window.addEventListener("beforeunload", e => {
  if (reviewPending) { navigator.sendBeacon("/api/review", JSON.stringify(reviewPending)); reviewPending = null; }
  if (dirty) { navigator.sendBeacon("/api/save", JSON.stringify({plan})); setDirty(false); }

const STATUS_COLOR = {"편집 중": "#3a3a42", "컨펌 요청": "#2a6ae0", "수정 요청": "#c2410c", "승인": "#15803d", "업로드 완료": "#555"};

function parseReview(memo) {   // '0:12 자막 오타', '12초 컷', '0:20~0:24 빼기' → [{text, t}]
  return memo.split(/\n+/).map(x => x.trim()).filter(Boolean).map(text => {
    let m = /(\d{1,2}):(\d{2})(?:\.(\d))?/.exec(text), t = null;
    if (m) t = +m[1] * 60 + +m[2] + (m[3] ? +m[3] / 10 : 0);
    else if ((m = /(\d+(?:\.\d)?)\s*초/.exec(text))) t = +m[1];
    return {text, t};
  });
}

  clearTimeout(reviewTimer); reviewTimer = setTimeout(flushReview, 400);
}

}

});
rb.addEventListener("click", async e => {
  const t = e.target.closest("[data-rqt],[data-restore],#revealBtn"); if (!t) return;
  if (t.dataset.rqt) { seek(+t.dataset.rqt); return; }
  if (t.id === "revealBtn") { const j = await api("/api/reveal", {}); if (!j.ok) toast("폴더 위치: " + j.path, 7000); return; }
  if (t.dataset.restore) { if (!confirm("이 시점의 편집으로 되돌릴까요? (지금 상태도 되돌리기로 돌아올 수 있음)")) return;
    const j = await api("/api/history/" + encodeURIComponent(t.dataset.restore)); const b = snapshot(); plan = j.plan; commit(b); toast("되돌렸습니다"); }
});
$("#homeBtn").onclick = async () => { await flushReview(); if (dirty) await save(); location.href = "/"; };

/* ================= 진단 점수 ================= */
function renderScore() {
  if (!diag) return; const s = $("#score"); s.textContent = `AI 진단 ${diag.score}`;
  s.className = "chip " + (diag.score >= 85 ? "good" : diag.score >= 65 ? "mid" : "bad");
}
$("#score").onclick = () => { sel = null; rightTab = "ai"; renderTimeline(); renderProps(); updateTools(); };

load().then(() => requestAnimationFrame(tick)).catch(e => toast("불러오기 실패: " + e.message, 10000));
</script>
</body>
</html>
